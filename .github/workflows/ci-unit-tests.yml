# Fast unit tests on every push to main and every pull request. The integration tests (marked "integration")
# start real Flower/Ray simulations; run them locally with:  pytest -m integration
name: CI — Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older run instead of queueing both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # the version requirements.txt was verified with
      - name: Install dependencies
        run: |
          pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run unit tests with coverage
        run: pytest -m "not integration" --cov=src --cov-report=term-missing
