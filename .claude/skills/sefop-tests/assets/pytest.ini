[pytest]
# Adjust pythonpath to the repo's layout: "src" for a src/ layout, "." for modules or a package at the root.
# tests/oracles is added so every test can import the brute-force pseudo-oracle.
pythonpath = . tests/oracles
testpaths = tests

# Tests marked xfail document a confirmed bug (see the repo's bug list). With strict, a fixed bug
# "unexpectedly passes" and the run FAILS, which reminds you to remove the marker so the test guards the fix.
xfail_strict = true

markers =
    integration: end-to-end runs through several functions, real solvers or large data (deselect with -m "not integration")
