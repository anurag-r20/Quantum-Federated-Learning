[pytest]
# Modules live flat in src/ (gia_attack.py, utils/, ...); importlib mode keeps tests/utils from shadowing src/utils.
pythonpath = src
testpaths = tests
addopts = --import-mode=importlib

# Tests marked xfail document a confirmed bug (see "Known bugs" in README.md). With strict, a fixed bug
# "unexpectedly passes" and the run FAILS, which reminds you to remove the marker so the test guards the fix.
xfail_strict = true

markers =
    integration: end-to-end Flower/Ray simulations, plaintext and FHE (about a minute; deselect with -m "not integration")

filterwarnings =
    # protobuf / ray still use pkg_resources (setuptools < 70 is pinned for ray 2.6); not our code
    ignore:Deprecated call to `pkg_resources.declare_namespace:DeprecationWarning
    ignore:pkg_resources is deprecated:DeprecationWarning
